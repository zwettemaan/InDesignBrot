<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>InDesignBrot</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "SF Pro Text", "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #f2f2f2;
      color: #1f1f1f;
    }

    main {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    p {
      margin: 0;
      font-size: 12px;
      line-height: 1.4;
    }

    button {
      width: 100%;
      min-height: 34px;
      border: 0;
      border-radius: 6px;
      background: #0f62fe;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
    }

    button[disabled] {
      opacity: 0.6;
    }

    #status {
      min-height: 48px;
      padding: 10px;
      border-radius: 6px;
      background: #ffffff;
      color: #303030;
      font-size: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    #status[data-kind="error"] {
      color: #8a1f11;
      background: #fdecea;
    }
  </style>
</head>
<body>
  <main>
    <h1>InDesignBrot</h1>
    <p>Compare the same script running directly in the panel runtime versus through the UXPScript bridge.</p>
    <button id="run-direct" type="button">Run In Panel UXP</button>
    <button id="run-bridge" type="button">Run Via UXPScript Bridge</button>
    <div id="status">Choose a run mode to compare panel UXP with bridged UXPScript.</div>
  </main>
  <script src="main.js"></script>
</body>
</html>
